<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Veil flat aperture logo system board</title>
  <desc id="desc">A flat system board showing the redesigned Veil aperture mark in primary, outline, and app icon forms.</desc>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#D9DEE4" stroke-width="1"/>
    </pattern>
    <g id="primary-mark">
      <path d="M128 12 244 128 128 244 12 128Z" fill="#101318"/>
      <path d="M128 39 207 128 128 217 49 128Z" fill="#F7FAFA"/>
      <path d="M49 128 96 88 116 108 89 128 116 156 98 179Z" fill="#18C7B6"/>
      <path d="M207 128 160 88 140 108 167 128 140 156 158 179Z" fill="#F2B84B"/>
      <path d="M86 82h26l16 52 16-52h26l-42 116Z" fill="#101318"/>
      <path d="M128 39 207 128 128 217 49 128Z" fill="none" stroke="#101318" stroke-width="6" stroke-linejoin="round" opacity=".94"/>
      <path d="M128 12 244 128 128 244 12 128Z" fill="none" stroke="#101318" stroke-width="8" stroke-linejoin="round"/>
    </g>
    <g id="outline-mark">
      <path d="M128 12 244 128 128 244 12 128Z" fill="none" stroke="#101318" stroke-width="12" stroke-linejoin="round"/>
      <path d="M92 86 128 198 164 86" fill="none" stroke="#101318" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M55 128 98 96 114 128 98 160Z" fill="none" stroke="#18C7B6" stroke-width="10" stroke-linejoin="round"/>
      <path d="M201 128 158 96 142 128 158 160Z" fill="none" stroke="#F2B84B" stroke-width="10" stroke-linejoin="round"/>
    </g>
    <g id="reverse-mark">
      <path d="M128 12 244 128 128 244 12 128Z" fill="#F7FAFA"/>
      <path d="M128 39 207 128 128 217 49 128Z" fill="#101318"/>
      <path d="M49 128 96 88 116 108 89 128 116 156 98 179Z" fill="#18C7B6"/>
      <path d="M207 128 160 88 140 108 167 128 140 156 158 179Z" fill="#F2B84B"/>
      <path d="M86 82h26l16 52 16-52h26l-42 116Z" fill="#F7FAFA"/>
      <path d="M128 39 207 128 128 217 49 128Z" fill="none" stroke="#F7FAFA" stroke-width="6" stroke-linejoin="round" opacity=".94"/>
      <path d="M128 12 244 128 128 244 12 128Z" fill="none" stroke="#F7FAFA" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="1400" height="800" fill="#F7FAFA"/>
  <rect width="1400" height="800" fill="url(#grid)" opacity=".55"/>
  <rect x="840" y="110" width="300" height="300" rx="48" fill="#101318"/>
  <use href="#primary-mark" x="166" y="132" width="300" height="300"/>
  <use href="#outline-mark" x="512" y="132" width="300" height="300"/>
  <use href="#reverse-mark" x="862" y="132" width="256" height="256"/>
  <g transform="translate(292 560)">
    <rect x="0" y="0" width="70" height="70" rx="2" fill="#101318"/>
    <rect x="112" y="0" width="70" height="70" rx="2" fill="#F7FAFA" stroke="#D9DEE4" stroke-width="2"/>
    <rect x="224" y="0" width="70" height="70" rx="2" fill="#18C7B6"/>
    <rect x="336" y="0" width="70" height="70" rx="2" fill="#315CFF"/>
    <rect x="448" y="0" width="70" height="70" rx="2" fill="#F2B84B"/>
    <rect x="560" y="0" width="70" height="70" rx="2" fill="#68717E"/>
  </g>
</svg>
